services:
  ansible-runner:
    image: ansible-runner
    build:
      context: ..
      dockerfile: ansible-runner/Dockerfile
      # Host networking, for the build and the container: on the Docker bridge,
      # glibc's parallel A/AAAA lookups lose packets to the NAT and name
      # resolution fails intermittently (github.com: 1 lookup in 8)
      network: host
    network_mode: host
    command: tail -f /dev/null
    container_name: ansible-runner
    restart: unless-stopped
    volumes:
      # The whole repository, for make verify (scripts/)
      - ./..:/repo
      - ./../ansible:/ansible
      - ./../kubernetes:/kubernetes
      - ./../terraform:/terraform
      - ${HOME}/.secrets:/home/runner/.secrets
      - ${HOME}/.ssh/id_rsa:/home/runner/.ssh/id_rsa:ro
      - ${HOME}/.ssh/id_rsa.pub:/home/runner/.ssh/id_rsa.pub:ro
      # The control host's trusted host keys, shared with its own ssh
      - ${HOME}/.ssh/known_hosts:/home/runner/.ssh/known_hosts
      - ${HOME}/.kube:/home/runner/.kube
      - ${HOME}/.certbot/log:/home/runner/.certbot/log
      - ${HOME}/.certbot/config:/home/runner/.certbot/config
      - ${HOME}/.certbot/work:/home/runner/.certbot/work
