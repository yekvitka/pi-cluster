---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: strimzi-kafka-operator-app
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  targetNamespace: kafka
  sourceRef:
    kind: GitRepository
    name: flux-system
  # PodMonitors (prometheus-operator CRDs) and GrafanaDashboards
  dependsOn:
    - name: kube-prometheus-stack-app
    - name: grafana-operator-app
  path: ./kubernetes/platform/kafka/strimzi-kafka-operator/overlays/prod
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kafka-cluster-app
  namespace: flux-system
spec:
  interval: 30m
  timeout: 15m
  targetNamespace: kafka
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: strimzi-kafka-operator-app
    - name: external-secrets-config
    - name: longhorn-app
  path: ./kubernetes/platform/kafka/cluster/overlays/prod
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
