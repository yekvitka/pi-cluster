---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kiali-app
  namespace: flux-system
spec:
  interval: 30m
  timeout: 15m
  targetNamespace: kiali
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Route on public-gateway; login with a service account token (auth: token)
  dependsOn:
    - name: istio-app
    - name: envoy-gateway-config
  path: ./kubernetes/platform/kiali/app/overlays/prod
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
