---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cert-manager-app.yaml
  - cilium-app.yaml
  - coredns-app.yaml
  - csi-external-snapshotter-app.yaml
  - envoy-gateway-app.yaml
  - external-dns-app.yaml
  - external-secrets-app.yaml
  - fluent-app.yaml
  - flux-app.yaml
  - grafana-app.yaml
  - k3s-etcd-backup-app.yaml
  - kube-prometheus-stack-app.yaml
  - loki-app.yaml
  - longhorn-app.yaml
  - metrics-server-app.yaml
  - pod-cleanup-app.yaml
  - otel-collector-app.yaml
  - rancher-app.yaml
  - system-upgrade-app.yaml
  - tempo-app.yaml
  - vault-app.yaml
  - velero-app.yaml
  - kube-vip-app.yaml

patches:
  # A failed reconciliation retries after 2 minutes, not after the interval
  # (30m): after a power cycle health checks fail until the services they
  # wait for are up, and each app would otherwise stay failed for 30 minutes
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
    patch: |-
      - op: add
        path: /spec/retryInterval
        value: 2m
