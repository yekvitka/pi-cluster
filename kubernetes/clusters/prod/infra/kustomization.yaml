apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Disabled to fit 4 GB Raspberry Pis with a single worker (node5):
# fluent-app, loki-app, otel-collector-app, tempo-app
# rancher-app: Rancher runs its controllers on the control plane nodes (see README)
resources:
  - cert-manager-app.yaml
  - cilium-app.yaml
  - coredns-app.yaml
  - csi-external-snapshotter-app.yaml
  - descheduler-app.yaml
  - envoy-gateway-app.yaml
  - external-dns-app.yaml
  - external-secrets-app.yaml
  - flux-app.yaml
  - grafana-app.yaml
  - k3s-etcd-backup-app.yaml
  - kube-prometheus-stack-app.yaml
  - longhorn-app.yaml
  - metrics-server-app.yaml
  - system-upgrade-app.yaml
  - vault-app.yaml
  - velero-app.yaml
  - kube-vip-app.yaml

