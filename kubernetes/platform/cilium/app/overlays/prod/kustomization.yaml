---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system

resources:
  - ../../base

components:
  - ../../components/monitoring
  - ../../components/hubble
  - ../../components/route-basic-auth
  # Istio ambient (Cluster 2.0 phase 10): cni.exclusive false lets istio-cni
  # chain into Cilium's CNI config, socket LB in the host namespace only
  - ../../components/istio-config

configMapGenerator:
  - name: cilium-helm-values
    behavior: merge
    files:
      - overlay-values.yaml=values.yaml

patches:
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: cilium
    path: helm-patch.yaml
