---
# htpasswd entry (SHA, the only format Envoy accepts) from Vault, written by
# ansible/configure_webui_auth.yml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: webui-basic-auth
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: webui-basic-auth
    template:
      engineVersion: v2
      data:
        .htpasswd: "{{ .htpasswd }}"
  data:
    - secretKey: htpasswd
      remoteRef:
        key: webui/basic-auth
        property: htpasswd
