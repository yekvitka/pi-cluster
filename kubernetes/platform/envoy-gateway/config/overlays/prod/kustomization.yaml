apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: envoy-gateway-system

resources:
  - ../../base

components:
  - ../../components/monitoring

patches:
  # Single worker: one Envoy proxy replica
  - target:
      kind: EnvoyProxy
      name: envoy
    patch: |-
      - op: replace
        path: /spec/provider/kubernetes/envoyDeployment/replicas
        value: 1
