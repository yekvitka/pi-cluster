---
# loki helm values (prod overlay)

loki:
  commonConfig:
    replication_factor: 1

# Loki P1 (docs/plans/cluster-2.0.md): Simple Scalable, one pod per component.
# write and backend have Longhorn volumes: only storage nodes run the Longhorn CSI
# plugin, so they are pinned there; read, gateway and caches go anywhere
write:
  replicas: 1
  nodeSelector:
    node_storage: longhorn
  # Prefer node3 (etcd-only storage node) over node5 (worker running monitoring):
  # merged with the chart's default podAntiAffinity
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node_type
                operator: DoesNotExist
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      # 200m was too little to catch up after an outage: Fluent Bit resends its
      # backlog, pushes time out after 5 s and the retries keep the ingester
      # saturated (2026-11-06, 15 min of rejected pushes until raised)
      cpu: "1"
      # Ingesters go past 256Mi under load
      memory: 512Mi

# Reduce memcached cache sizes from massive defaults (8GB/1GB) to homelab-appropriate values
# Defaults: chunksCache.allocatedMemory=8192, resultsCache.allocatedMemory=1024
chunksCache:
  allocatedMemory: 256
  allocatedCPU: 100m

resultsCache:
  allocatedMemory: 128
  allocatedCPU: 100m

# Resource limits for every Loki component
# Actual usage: backend 166-257Mi, read 131-167Mi, write 97-114Mi
backend:
  replicas: 1
  nodeSelector:
    node_storage: longhorn
  # Prefer node3 (etcd-only storage node) over node5 (worker running monitoring):
  # merged with the chart's default podAntiAffinity
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node_type
                operator: DoesNotExist
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

read:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

gateway:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
