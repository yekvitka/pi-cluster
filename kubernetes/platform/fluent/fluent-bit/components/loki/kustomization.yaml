apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Fluent Bit -> Loki only (Loki P1, docs/plans/cluster-2.0.md). The forwarding
# component also ships to Elasticsearch, the aggregator component to Fluentd
resources:
  - fluent-bit-config.yaml

configMapGenerator:
  - name: fluent-bit-helm-values
    behavior: merge
    files:
      - loki-values.yaml=values.yaml

patches:
- target:
    group: helm.toolkit.fluxcd.io
    kind: HelmRelease
    name: fluent-bit
  path: helm-patch.yaml
