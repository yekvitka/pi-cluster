---
# kube-vip helm values (prod overlay)
image:
  # v1.2.0 introduces application-level Prometheus metrics (kube_vip_*)
  tag: "v1.2.0"

config:
  address: 10.0.0.10

env:
  # See Installation flags: https://kube-vip.io/docs/installation/flags/
  # Enable only kube-vip control plane functionality
  cp_enable: "true"
  svc_enable: "false"
  # VIP configuration
  vip_interface: "eth0"
  vip_arp: "true"
  vip_leaderelection: "true"
  # Lease 60s/40s/5s as k3s's controllers (ansible/group_vars/all/k3s.yml): kube-vip
  # deletes the VIP when it cannot renew, and Cilium on node6 recompiles every
  # endpoint for each VIP change (2026-11-07). A slow API under 40 s keeps the
  # VIP; a k3s restart still drops it (kube-vip v1.2.0 deletes it at start)
  vip_leaseduration: "60"
  vip_renewdeadline: "40"
  vip_retryperiod: "5"
  vip_ddns: "false"
  vip_subnet: "32,128"
  cp_namespace: "kube-system"
  # ARP configuration
  enable_node_labeling: "true"
  # No IPVS load balancer: with one API server it only forwarded the VIP to
  # node6's own listener (k3s binds *:6443), and its health check restarted
  # kube-vip, dropping the VIP, when the API answered slowly after a power
  # cycle (2026-11-08: 3 restarts, "no local backends available"). Turn it back
  # on with a second API server to spread the API load
  lb_enable: "false"
  # Enable Prometheus metrics
  prometheus_server: ":2112"

envValueFrom:
  vip_nodename:
    fieldRef:
      fieldPath: spec.nodeName

resources:
  limits:
    cpu: 500m
    memory: 500Mi
  requests:
    cpu: 100m
    memory: 100Mi

serviceAccount:
  create: true
  name: kube-vip

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
