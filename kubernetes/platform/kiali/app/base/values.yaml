---
# kiali-operator helm values (base)

cr:
  create: true
  namespace: kiali
  spec:
    istio_namespace: "istio-system"
    server:
      web_fqdn: "kiali.${CLUSTER_DOMAIN}"
      web_port: "443"
      web_schema: "https"
      web_root: "/"
    auth:
      # Log in with a Kubernetes service account token (no identity provider)
      strategy: token
    external_services:
      prometheus:
        # Prometheus service (no routePrefix configured in kube-prometheus-stack)
        url: "http://kube-prometheus-stack-prometheus.kube-prom-stack:9090"
      grafana:
        enabled: true
        # Grafana service at grafana-service.grafana:3000, no sub-path (root_url is /)
        internal_url: 'http://grafana-service.grafana:3000'
        # Public facing URL of Grafana
        external_url: 'https://grafana.${CLUSTER_DOMAIN}'
        auth:
          # Kiali's service account token login is not valid for Grafana: no
          # Grafana API access, check the dashboard links when Kiali is enabled
          type: none
      tracing:
        # Enabled by default. Kiali will anyway fallback to disabled if
        # Tempo is unreachable.
        enabled: true
        # Tempo service name is "query-frontend" and is in the "tempo" namespace.
        internal_url: "http://tempo-query-frontend.tempo.svc.cluster.local:3100/"
        provider: "tempo"
        tempo_config:
          org_id: "1"
          datasource_uid: "a8d2ef1c-d31c-4de5-a90b-e7bc5252cd00"
        # Use grpc to speed up the download of metrics
        use_grpc: true
        grpc_port: 9095
    deployment:
      # Enabling debug logs
      logger:
        log_level: debug
