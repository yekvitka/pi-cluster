---
# tempo helm values (prod overlay)

# Resource limits for every Tempo component
# ingester-1 uses up to 631Mi, others under 100Mi

ingester:
  replicas: 1
  # Write-ahead log in an emptyDir on the node's disk: SSD nodes only
  # (node_storage=longhorn), node3 preferred over node5 (monitoring).
  # The chart templates affinity as a string; it replaces the default pod
  # anti-affinity, which has no effect with one replica
  nodeSelector:
    node_storage: longhorn
  affinity: |
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node_type
                operator: DoesNotExist
  config:
    replication_factor: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

compactor:
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi

distributor:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

querier:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

queryFrontend:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

metricsGenerator:
  # Write-ahead log in an emptyDir on the node's disk: SSD nodes only
  # (node_storage=longhorn), node3 preferred over node5 (monitoring).
  # The chart templates affinity as a string; it replaces the default pod
  # anti-affinity, which has no effect with one replica
  nodeSelector:
    node_storage: longhorn
  affinity: |
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node_type
                operator: DoesNotExist
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi
