---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-agent
  namespace: system-upgrade
  labels:
    k3s-upgrade: agent
spec:
  nodeSelector:
    matchExpressions:
      # Agents: no etcd role (every server, etcd-only included, has it)
      - key: node-role.kubernetes.io/etcd
        operator: DoesNotExist
      # k3s adds the etcd role a few seconds after a server registers: in that
      # window a new server matched this plan and its job, deleted mid-way,
      # left the node cordoned. Workers have node_type=worker from registration
      - key: node_type
        operator: In
        values:
          - worker
  serviceAccountName: system-upgrade
  # Wait for k3s-server upgrade plan to complete before executing k3s-agent plan
  prepare:
    image: rancher/k3s-upgrade
    args:
      - prepare
      - k3s-server
  concurrency: 1
  jobActiveDeadlineSecs: 1800
  # Cordon node before upgrade it
  cordon: true
  upgrade:
    image: rancher/k3s-upgrade
  # renovate: datasource=github-releases depName=k3s-io/k3s
  version: v1.36.5+k3s1
