---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kafka

# Cluster 2.0 phase 11: one KRaft broker (controller + broker) on node6, its
# volume on node6's SSD (Longhorn). Internal listeners only: the external TLS
# listener (components/external-listener) and the broker anti-affinity
# (components/anti-affinity) are for three brokers
resources:
  - ../../base
  - storageclass.yaml

components:
  - ../../components/security
  - ../../components/superuser
  - ../../components/monitor

patches:
  - target:
      group: kafka.strimzi.io
      kind: KafkaNodePool
      name: dual-role
    path: node-pool-patch.yaml
  - target:
      group: kafka.strimzi.io
      kind: Kafka
      name: cluster
    path: cluster-patch.yaml
