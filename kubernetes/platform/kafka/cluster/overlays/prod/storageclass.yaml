---
# Kafka's volume: one replica kept on the node that uses it (best-effort data
# locality), so the broker on node6 reads and writes its own SSD
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-kafka
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  dataLocality: "best-effort"
  staleReplicaTimeout: "30"
  fsType: "ext4"
  dataEngine: "v1"
