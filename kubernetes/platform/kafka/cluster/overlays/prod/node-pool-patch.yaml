---
# One broker, on node6: the only node with both the control-plane role and
# Longhorn storage. It tolerates node6's control-plane taint
- op: replace
  path: /spec/replicas
  value: 1
- op: add
  path: /spec/storage/volumes/0/class
  value: longhorn-kafka
- op: add
  path: /spec/template
  value:
    pod:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
                  - key: node_storage
                    operator: In
                    values:
                      - longhorn
