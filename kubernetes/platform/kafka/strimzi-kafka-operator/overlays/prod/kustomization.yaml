---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kafka

resources:
  - ../../base

components:
  - ../../components/monitor
  # components/istio (PeerAuthentication) comes with Istio (Cluster 2.0 phase 10)

configMapGenerator:
  - name: strimzi-kafka-operator-helm-values
    behavior: merge
    files:
      - overlay-values.yaml=values.yaml

patches:
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: strimzi-kafka-operator
    path: helm-patch.yaml
