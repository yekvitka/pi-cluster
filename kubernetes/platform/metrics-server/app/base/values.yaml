---
# metrics-server helm values (base)

metrics:
  enabled: true
serviceMonitor:
  enabled: true

# Kubelet scrape timeout 25s: a busy node (node6 at full CPU) answers late,
# and with the default 10s its metrics go stale
args:
  - --kubelet-request-timeout=25s
  - --kubelet-insecure-tls
  - --metric-resolution=30s
