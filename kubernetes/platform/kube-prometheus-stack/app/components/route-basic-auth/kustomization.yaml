apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Prometheus and Alertmanager on https://prometheus.${CLUSTER_DOMAIN} and
# https://alertmanager.${CLUSTER_DOMAIN} (public-gateway, wildcard certificate)
# behind basic auth. The upstream route component uses OIDC (Keycloak), which is
# not deployed. Credentials: make configure-webui-auth
resources:
  - webui-basic-auth-externalsecret.yaml
  - security-policy.yaml

configMapGenerator:
  - name: kube-prometheus-stack-helm-values
    behavior: merge
    files:
      - route-values.yaml=values.yaml

patches:
- target:
    group: helm.toolkit.fluxcd.io
    kind: HelmRelease
    name: kube-prometheus-stack
  path: helm-patch.yaml
