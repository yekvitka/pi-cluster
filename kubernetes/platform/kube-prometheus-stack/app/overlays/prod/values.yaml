# kube-prometheus-stack helm values (prod overlay)

prometheus:
  prometheusSpec:
    # Longhorn volume: a worker that is a Longhorn storage node
    nodeSelector:
      node_type: worker
      node_storage: longhorn
    # Fewer samples and a smaller TSDB keep memory use under the limit.
    # node-exporter and the kubelet (cAdvisor) are scraped every 30s (below):
    # Lens computes rates over 1m windows, empty with one sample per minute
    scrapeInterval: 60s
    evaluationInterval: 60s
    retention: 6h
    retentionSize: 1GB
    # Was 700Mi (base) at ~673Mi used; the 30s node and container metrics add
    # samples. node5 has ~1.2 GB free
    resources:
      requests:
        cpu: 100m
        memory: 640Mi
      limits:
        memory: 900Mi

alertmanager:
  alertmanagerSpec:
    # Longhorn volume: a worker that is a Longhorn storage node, like Prometheus and Grafana
    nodeSelector:
      node_type: worker
      node_storage: longhorn

# k3s serves API server, etcd, scheduler and controller metrics on the kubelet
# /metrics endpoint: their histograms were ~70% of all series. This list
# replaces the chart default, so the first rule repeats it
kubelet:
  serviceMonitor:
    # Container CPU/memory for Lens (rate over 1m needs two samples per minute)
    interval: 30s
    metricRelabelings:
      # Chart default
      - action: drop
        sourceLabels: [__name__, le]
        regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
      # Chart default of kubeApiServer, which does not apply on k3s: drop the
      # fine-grained buckets, the ones used by the SLO alerts stay
      - action: drop
        sourceLabels: [__name__, le]
        regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
      # Histograms of internal details, rarely needed: keep _count and _sum only
      - action: drop
        sourceLabels: [__name__]
        regex: (apiserver_watch_list_duration_seconds|apiserver_request_body_size_bytes|apiserver_watch_cache_read_wait_seconds|apiserver_watch_events_sizes|apiserver_response_sizes|workqueue_queue_duration_seconds|workqueue_work_duration_seconds|scheduler_plugin_execution_duration_seconds)_bucket
      # Not used by any alert rule or dashboard (the API server dashboard uses
      # apiserver_request_duration_seconds _sum/_count, the SLO alerts the _sli_ buckets)
      - action: drop
        sourceLabels: [__name__]
        regex: (etcd_request_duration_seconds|apiserver_request_duration_seconds|apiserver_admission_controller_admission_duration_seconds|prober_probe_duration_seconds|apiserver_flowcontrol_request_execution_seconds|apiserver_flowcontrol_priority_level_request_utilization|rest_client_request_size_bytes|rest_client_response_size_bytes)_bucket
      - action: drop
        sourceLabels: [__name__]
        regex: kubernetes_feature_enabled|apiextensions_openapi_v[23]_regeneration_count

# Node CPU, memory, network and disk for Lens: rate over 1m needs two samples
# per minute (the global scrape interval is 60s). ~4900 series
prometheus-node-exporter:
  prometheus:
    monitor:
      interval: 30s
