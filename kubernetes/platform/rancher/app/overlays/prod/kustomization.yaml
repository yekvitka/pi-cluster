apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cattle-system

resources:
  - ../../base

components:
  - ../../components/route

configMapGenerator:
  - name: rancher-helm-values
    behavior: merge
    files:
      - overlay-values.yaml=values.yaml

patches:
- target:
    group: helm.toolkit.fluxcd.io
    kind: HelmRelease
    name: rancher
  path: helm-patch.yaml
