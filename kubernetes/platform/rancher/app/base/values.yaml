# rancher helm values (base)
hostname: rancher.${CLUSTER_DOMAIN}
# Single replica: small Raspberry Pi cluster
replicas: 1
# TLS is terminated by Envoy Gateway (public-gateway, wildcard certificate)
# Rancher is exposed with an HTTPRoute on public-gateway (components/route):
# the chart must not create its own Ingress or Gateway
tls: external
networkExposure:
  type: "none"
# bootstrapPassword not set: Rancher generates one and stores it in
# secret cattle-system/bootstrap-secret
