---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: rancher-stable
spec:
  url: https://releases.rancher.com/server-charts/stable
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rancher
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: rancher
      # Rancher 2.15 supports Kubernetes < 1.37 (k3s held on 1.36.x, see .github/renovate.json5)
      version: 2.15.2
      sourceRef:
        kind: HelmRepository
        name: rancher-stable
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  valuesFrom:
  - kind: ConfigMap
    name: rancher-helm-values
    valuesKey: base-values.yaml
