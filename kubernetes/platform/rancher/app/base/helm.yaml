---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: rancher-stable
spec:
  url: https://releases.rancher.com/server-charts/stable
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rancher
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: rancher
      # Rancher 2.15 supports Kubernetes < 1.37 (k3s held on 1.36.x, see .github/renovate.json5)
      version: 2.15.2
      sourceRef:
        kind: HelmRepository
        name: rancher-stable
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  valuesFrom:
  - kind: ConfigMap
    name: rancher-helm-values
    valuesKey: base-values.yaml
  # Rancher clones its chart catalogs (~155k files) into the container's
  # writable layer, and containerd walks that layer for every kubelet stats
  # request: a full core on node6 and slow etcd answers (2026-11-08). On an
  # emptyDir the kubelet measures it once a minute instead
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Deployment
          name: rancher
        patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: rancher
          spec:
            template:
              spec:
                containers:
                  - name: rancher
                    volumeMounts:
                      - name: local-catalogs
                        mountPath: /var/lib/rancher-data/local-catalogs
                volumes:
                  - name: local-catalogs
                    emptyDir: {}
