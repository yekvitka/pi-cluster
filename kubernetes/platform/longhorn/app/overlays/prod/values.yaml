# longhorn helm values (prod overlay)
# Two storage nodes (node_storage=longhorn): node5 (worker) and node3 (control
# plane, SSD boot). One replica of each volume on each
persistence:
  defaultClassReplicaCount: 2
defaultSettings:
  defaultReplicaCount: 2
  # Instance managers, engine images and the CSI plugin on storage nodes only
  systemManagedComponentsNodeSelector: "node_storage:longhorn"

# Longhorn only on storage nodes (node_storage=longhorn, k3s config): no
# Longhorn components or data on the SD card nodes. Pods with Longhorn volumes
# must run on storage nodes too
longhornManager:
  nodeSelector:
    node_storage: longhorn
longhornDriver:
  nodeSelector:
    node_storage: longhorn
longhornUI:
  replicas: 1
  nodeSelector:
    node_storage: longhorn
# One replica of each CSI sidecar
csi:
  attacherReplicaCount: 1
  provisionerReplicaCount: 1
  resizerReplicaCount: 1
  snapshotterReplicaCount: 1
