---
# longhorn helm values (prod overlay)
# Storage nodes (node_storage=longhorn, SSD): node3 (etcd-only), node5 (worker).
# One replica per volume: no redundancy, Velero backups only
persistence:
  defaultClassReplicaCount: 1
defaultSettings:
  defaultReplicaCount: 1
  # Instance managers, engine images and the CSI plugin on storage nodes only
  systemManagedComponentsNodeSelector: "node_storage:longhorn"
  # Delete stale replica data and processes (orphans) after the 5-minute grace
  # period: with one replica, a copy left behind is never used again
  orphanResourceAutoDeletion: "replica-data;instance"
  # Left from Kafka's volume on node6 (2026-11-06/07): no effect while no
  # tainted node has node_storage=longhorn. Longhorn applies a change of this
  # setting only with every volume detached (docs/runbooks/node-ssd-migration.md)
  taintToleration: "node-role.kubernetes.io/control-plane:NoSchedule"

# Longhorn only on storage nodes (node_storage=longhorn, k3s config): no
# Longhorn components or data on the SD card nodes. Pods with Longhorn volumes
# must run on storage nodes too
longhornManager:
  nodeSelector:
    node_storage: longhorn
longhornDriver:
  nodeSelector:
    node_storage: longhorn
longhornUI:
  replicas: 1
  nodeSelector:
    node_storage: longhorn
# One replica of each CSI sidecar
csi:
  attacherReplicaCount: 1
  provisionerReplicaCount: 1
  resizerReplicaCount: 1
  snapshotterReplicaCount: 1
