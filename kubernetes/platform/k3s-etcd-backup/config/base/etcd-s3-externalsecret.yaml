# S3 configuration for k3s etcd snapshots (k3s etcd-s3-config-secret).
# k3s reads it from kube-system when it takes a snapshot
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: k3s-etcd-s3-externalsecret
  namespace: kube-system
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: k3s-etcd-snapshot-s3-config
    template:
      engineVersion: v2
      data:
        etcd-s3-endpoint: "${S3_SERVER}:9091"
        etcd-s3-region: eu-west-1
        etcd-s3-bucket: k3s-etcd
        etcd-s3-access-key: "{{ .user | toString }}"
        etcd-s3-secret-key: "{{ .key | toString }}"
  data:
    - secretKey: user
      remoteRef:
        key: s3/etcd
        property: username
    - secretKey: key
      remoteRef:
        key: s3/etcd
        property: key
