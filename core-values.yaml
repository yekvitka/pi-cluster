replicaCount: 3
k8sAppLabelOverride: kube-dns
serviceAccount:
  create: true
service:
  name: kube-dns
  clusterIP: 10.43.0.10

# Zone files with initial data and TSIG keys
zoneFiles:
  # Main zone file for homelab.yekvitka.com
  homelab.yekvitka.com: |
    $ORIGIN homelab.yekvitka.com.
    @	3600 IN	SOA ns.homelab.yekvitka.com. hostmaster.homelab.yekvitka.com. (
            2025091101 ; serial
            7200       ; refresh (2 hours)
            3600       ; retry (1 hour)
            1209600    ; expire (2 weeks)
            3600       ; minimum (1 hour)
            )

            3600 IN NS ns.homelab.yekvitka.com.
            3600 IN A  10.0.0.1

    ns      3600 IN A  10.0.0.1
    
    ; External-DNS managed records will appear here
    
  # TSIG key configuration - this will be mounted in CoreDNS
  Kexternaldns-key.key: |
    key "externaldns-key" {
      algorithm hmac-sha256;
      secret "J8kvIwtkvYXLUcVj6mROEBLHy6h3Gle3j91vS8aJB9c=";
    };
    
  # Extra configuration for dynamic updates
  dynamic-update.conf: |
    ; Allow zone transfers and updates using the key
    update-policy {
      grant externaldns-key zonesub ANY;
    }

# Default zone is what Kubernetes recommends:
# https://kubernetes.io/docs/tasks/administer-cluster/dns-custom-nameservers/#coredns-configmap-options
servers:
- zones:
  - zone: homelab.yekvitka.com
  port: 53
  plugins:
  - name: errors
  # Serves a /health endpoint on :8080, required for livenessProbe
  - name: health
    configBlock: |-
      lameduck 5s
  # Serves a /ready endpoint on :8181, required for readinessProbe
  - name: ready
  # Log DNS requests for debugging
  - name: log
  # Enable DNS dynamic updates
  - name: auto
    parameters: homelab.yekvitka.com db {
    configBlock: |-
      reload 10s
      transfer to *
  # Configure file backend with transfer and update capabilities
  - name: file
    parameters: /etc/coredns/homelab.yekvitka.com homelab.yekvitka.com
    configBlock: |-
      transfer to *
      reload 10s
  # Forward to upstream DNS servers for unknown domains
  - name: forward
    parameters: . 10.0.0.1
  - name: cache
    parameters: 30
  - name: prometheus
    parameters: 0.0.0.0:9153
- zones:
  - zone: .
  port: 53
  plugins:
  - name: errors
  # Serves a /health endpoint on :8080, required for livenessProbe
  - name: health
    configBlock: |-
      lameduck 5s
  # Serves a /ready endpoint on :8181, required for readinessProbe
  - name: ready
  # Required to query kubernetes API for data
  - name: kubernetes
    parameters: cluster.local in-addr.arpa ip6.arpa
    configBlock: |-
      pods insecure
      fallthrough in-addr.arpa ip6.arpa
      ttl 30
  # Serves a /metrics endpoint on :9153, required for serviceMonitor
  - name: prometheus
    parameters: 0.0.0.0:9153
  - name: forward
    parameters: . /etc/resolv.conf
  - name: cache
    parameters: 30
  - name: loop
  - name: reload
  - name: loadbalance
