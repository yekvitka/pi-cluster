---
- hosts: pimaster
  become: yes
  tasks:
    - name: Download kubectl binary
      get_url:
        url: https://dl.k8s.io/release/v1.28.8/bin/linux/arm64/kubectl
        dest: /usr/local/bin/kubectl
        mode: '0755'
        force: yes
        validate_certs: yes
      register: kubectl_download
      ignore_errors: yes
      
    - name: Install kubectl using curl if download failed
      shell: |
        curl -LO "https://dl.k8s.io/release/v1.28.8/bin/linux/arm64/kubectl"
        chmod +x kubectl
        mv kubectl /usr/local/bin/kubectl
      when: kubectl_download is failed
      
    - name: Verify kubectl installation
      shell: kubectl version --client
      register: kubectl_version
      
    - name: Show kubectl version
      debug:
        var: kubectl_version.stdout
