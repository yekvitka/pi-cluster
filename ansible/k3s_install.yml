---
- name: Install K3S prerequisites
  hosts: k3s_cluster
  gather_facts: true
  tags: [install]
  become: true
  roles:
    - role: k3s/prereq

- name: Install K3S master node
  hosts: k3s_master
  tags: [install, master]
  become: true
  pre_tasks:
    - name: Load Vault session (vault_addr, vault_token, vault_cacert)
      ansible.builtin.include_tasks: tasks/vault_session.yml

    - name: Fetch k3s cluster token on-demand from Vault
      community.hashi_vault.vault_kv2_get:
        url: "{{ vault_addr }}"
        token: "{{ vault_token }}"
        ca_cert: "{{ vault_cacert | default(omit) }}"
        mount_point: secret
        path: cluster/k3s
      register: k3s_vault_secret
      delegate_to: localhost
      become: false

    - name: Set k3s_token fact from Vault
      ansible.builtin.set_fact:
        k3s_token: "{{ (k3s_vault_secret.secret | default({})).token | default('', true) }}"

    - name: Validate k3s cluster token
      ansible.builtin.assert:
        that:
          - k3s_token is defined
          - k3s_token | length > 0
        fail_msg: |
          Failed to retrieve k3s token from Vault at path secret/cluster/k3s
          Please ensure the secret exists and contains a 'token' key.
          You can create it with:
            vault kv put secret/cluster/k3s token='your-k3s-cluster-token'
        success_msg: "k3s cluster token retrieved and validated"

  roles:
    - role: k3s/master

- name: Install K3S worker nodes
  hosts: k3s_worker
  tags: [install, worker]
  become: true
  pre_tasks:
    - name: Load Vault session (vault_addr, vault_token, vault_cacert)
      ansible.builtin.include_tasks: tasks/vault_session.yml

    - name: Fetch k3s cluster token on-demand from Vault
      community.hashi_vault.vault_kv2_get:
        url: "{{ vault_addr }}"
        token: "{{ vault_token }}"
        ca_cert: "{{ vault_cacert | default(omit) }}"
        mount_point: secret
        path: cluster/k3s
      register: k3s_vault_secret
      delegate_to: localhost
      become: false

    - name: Set k3s_token fact from Vault
      ansible.builtin.set_fact:
        k3s_token: "{{ (k3s_vault_secret.secret | default({})).token | default('', true) }}"
    - name: Validate k3s cluster token
      ansible.builtin.assert:
        that:
          - k3s_token is defined
          - k3s_token | length > 0
        fail_msg: |
          Failed to retrieve k3s token from Vault at path secret/cluster/k3s
          Please ensure the secret exists and contains a 'token' key.
          You can create it with:
            vault kv put secret/cluster/k3s token='your-k3s-cluster-token'
        success_msg: "k3s cluster token retrieved and validated"
  roles:
    - role: k3s/worker

- name: Label K3S worker nodes
  hosts: k3s_master
  tags: [config]
  become: true
  tasks:
    - name: Label k3s worker nodes
      ansible.builtin.command:
        # Through the API address: an etcd-only server has no local API server
        cmd: "kubectl --server https://{{ k3s_api_vip }}:6443 label nodes {{ item }} kubernetes.io/role=worker"
      register: worker_label
      changed_when: "'not labeled' not in worker_label.stdout"
      run_once: true
      with_items: "{{ groups['k3s_worker'] }}"

- name: Get Kubernetes config file
  hosts: k3s_master
  tags: [kube-config]
  become: true
  tasks:
    - name: Get k3s config file
      run_once: true
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig_base64

    - name: Write Kubernetes config file with the correct cluster address
      ansible.builtin.copy:
        # The port too: an etcd-only server's k3s.yaml points to its local
        # load balancer (127.0.0.1:6444), not to an API server (6443)
        content: "{{ kubeconfig_base64.content | b64decode | regex_replace('https://127\\.0\\.0\\.1:[0-9]+', 'https://' ~ k3s_api_vip ~ ':6443') }}"
        dest: "~/.kube/config"
        mode: "0600"
      delegate_to: localhost
      run_once: true
      become: false

- name: Install Cilium CNI and CoreDNS
  hosts: localhost
  tags: [install, cni]
  gather_facts: false
  become: false
  tasks:

    - name: Set overlay to prod in case not defined by an input argument
      ansible.builtin.set_fact:
        overlay: "prod"
      when: overlay is undefined

    - name: Config Cilium CNI
      ansible.builtin.include_tasks: tasks/cilium_config.yml
