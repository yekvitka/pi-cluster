---
# node6 node variables (Cluster 2.0, docs/plans/cluster-2.0.md)
# Pi 4 8 GB, boots from a USB SSD. The only API server: API server, scheduler,
# controllers and an etcd member. Tainted: only system pods and Rancher (they
# tolerate the taint) run here. No Longhorn (k3s_longhorn_storage defaults to false)

# Joins through node3, an etcd member that does not depend on node6. The API
# virtual IP is node6's own: after a full outage node6 could not reach any
# other member through it and could only start from its own database
k3s_join_server: "{{ hostvars['node3'].ip }}"

# k3s server with Rancher's load measured at 1.8-1.9 GB on 4 GB masters;
# as the only API server it serves every client, so more headroom: the scheduler
# does not hand this memory to pods. Re-measured in phase 6
k3s_kube_reserved_memory: 3072Mi

# Keep the SSD's write cache (tasks/power_loss.yml): without it a synced 8 KB
# write took 49 ms instead of 1.4 ms (HyperX 3K behind the Initio bridge), etcd
# commits reached 500 ms p99 and the leader changed every few minutes
# (2026-11-08). With the cache the kernel sends flushes; node6 came through three
# hard power cuts without corruption
usb_disk_write_cache: true

# SSD: Kingston SH103S3120G (node4's former SSD) on an Initio 13fd:5917 adapter:
# UAS without errors under load (2026-11-06), as node3. Quirk if it ever times
# out, as node1/node5:
# rpi_usb_storage_quirks:
#   - "13fd:5917:u"
