---
# Gateway runs OpenWrt and is not managed by Ansible. See metal/openwrt/README.md

- name: Configure External Node
  hosts: node1
  gather_facts: true
  tags: [external]
  become: true
  roles:
    # OS basic setup tasks
    - role: basic_setup
      tags: [os]

    # Security Hardening
    - role: ricsanfre.security
      tags: [security]

    # NTP Client configuration
    - role: ricsanfre.ntp
      tags: [ntp]

  tasks:
    # Vault and RustFS wait for a synced clock and for the DATA SSD (/storage)
    - name: Start order after a power cycle
      ansible.builtin.import_tasks: tasks/boot_order.yml
      vars:
        boot_order_services: [vault, rustfs]
        boot_order_mounts: [/storage]
      tags: [boot-order]

- name: Configure Pi Cluster Nodes
  hosts: k3s_cluster
  gather_facts: true
  tags: [node]
  become: true
  roles:
    # OS basic setup tasks
    - role: basic_setup
      tags: [os]

    # Security Hardening
    - role: ricsanfre.security
      tags: [security]

    # NTP Client configuration
    - role: ricsanfre.ntp
      tags: [ntp]

  tasks:
    # k3s waits for a synced clock
    - name: Start order after a power cycle
      ansible.builtin.import_tasks: tasks/boot_order.yml
      vars:
        boot_order_services: "{{ ['k3s'] if 'k3s_master' in group_names else ['k3s-agent'] }}"
      tags: [boot-order]

    - name: Storage prerequisites
      tags: [storage]
      block:
        # Longhorn attaches volumes over iSCSI
        - name: Configure iSCSI Initiator
          ansible.builtin.include_role:
            name: ricsanfre.iscsi_initiator
          vars:
            open_iscsi_initiator_name: "{{ iscsi_initiator_iqn_prefix }}:{{ ansible_facts['nodename'] }}"
            open_iscsi_automatic_startup: true
