operator:
  rollOutPods: true
  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"
rollOutCiliumPods: true
k8sServiceHost: 10.0.0.11
k8sServicePort: 6443
kubeProxyReplacement: true
kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
ipam:
  operator:
    clusterPoolIPv4PodCIDRList: "10.42.0.0/16"
l2announcements:
  enabled: true
externalIPs:
  enabled: true
k8sClientRateLimit:
  qps: 50
  burst: 200

# Monitoring and Hubble UI
operator:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
  dashboards:
    enabled: true
    annotations:
      grafana_folder: Cilium

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: "10s"
    trustCRDsExist: true

dashboards:
  enabled: true
  annotations:
    grafana_folder: Cilium

hubble:
  enabled: true
  metrics:
    enabled:
      - dns:query
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - http
    serviceMonitor:
      enabled: true
      interval: "10s"
    dashboards:
      enabled: true
      annotations:
        grafana_folder: Cilium
  relay:
    enabled: true
    rollOutPods: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
  ui:
    enabled: true
    rollOutPods: true
    ingress:
      enabled: true
      className: nginx
      hosts: ["hubble.picluster.ricsanfre.com"]
      tls:
        - hosts:
          - hubble.picluster.ricsanfre.com
          secretName: hubble-tls
