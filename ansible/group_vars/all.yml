---
# Group all variables.

# Remote user name
ansible_user: root

# Ansible ssh private key
ansible_ssh_private_key_file: ~/.ssh/id_rsa

# ricsanfre.security defaults to "no", which locks out ansible_user root
security_ssh_permit_root_login: "prohibit-password"

# ricsanfre.ntp defaults to Europe/Madrid
ntp_timezone: Europe/Warsaw

# GitOps Repo
# Whether the repo is private or not
git_private_repo: false

# Centralized SAN: node1 SSD2 serves one iSCSI LUN per k3s node, mounted at /storage
# See configure_centralized_san.yml
centralized_san: true

###################
# Default Gateway
###################
default_gateway: 10.0.0.1

#######################
# DNS configuration
#######################
# DNS server
dns_server: 10.0.0.1
dns_domain: homelab.yekvitka.com

############################
# restic backup role variables
############################
# Deactivate clean service. Only enabled in one node
restic_clean_service: false
restic_backups_dirs:
  - path: '/etc'
  - path: '/root'
    exclude:
      - pattern: '.cache'
      - pattern: '.ansible'
