---
# K3s cluster configuration.

# The VIP that kube-vip answers for the Kubernetes API
k3s_api_vip: 10.0.0.10

# k3s configuration directory
k3s_config_directory: /etc/rancher/k3s

# The server that starts a new cluster (cluster-init) when no server holds etcd
# data yet. In a running cluster every server joins through k3s_join_server
# (host_vars) or the API address. Explicit, not "first host of k3s_master".
k3s_cluster_init_node: node6

# kubelet configuration applied to every node
k3s_kubelet_config: |
  apiVersion: kubelet.config.k8s.io/v1beta1
  kind: KubeletConfiguration
  shutdownGracePeriod: 30s
  shutdownGracePeriodCriticalPods: 10s
  # Memory for k3s itself (server: API server + etcd + controllers, ~1.5 GB;
  # agent + containerd on workers) and the OS. The scheduler does not hand it
  # out and the kubepods cgroup limit keeps pods out of it
  kubeReserved:
    memory: {{ k3s_kube_reserved_memory | default('1700Mi' if 'k3s_master' in group_names else '600Mi') }}
  systemReserved:
    memory: 300Mi
  # Evict pods while the node still responds (4 GB Pis without swap).
  # Setting evictionHard replaces all kubelet defaults: keep the disk ones
  evictionHard:
    memory.available: 300Mi
    nodefs.available: 10%
    imagefs.available: 15%
    nodefs.inodesFree: 5%

# k3s server configuration
# Equivalent to starting the master installer with:
# --write-kubeconfig-mode '0600'
# --flannel-backend=none
# --disable-kube-proxy
# --disable-network-policy
# --disable-helm-controller
# --disable 'servicelb'
# --disable 'traefik'
# --disable 'local-storage'
# --disable 'coredns'
# --node-taint 'node-role.kubernetes.io/control-plane:NoSchedule'
# --kube-controller-manager-arg 'bind-address=0.0.0.0'
# --kube-proxy-arg 'metrics-bind-address=0.0.0.0'
# --kube-scheduler-arg 'bind-address=0.0.0.0'
# --kubelet-arg 'config=/etc/rancher/k3s/kubelet.config'
# --kube-controller-manager-arg 'terminated-pod-gc-threshold=10'
k3s_server_config:
  # Disable Flannel CNI
  flannel-backend: none
  disable-network-policy: true
  # Disable Helm Controller
  disable-helm-controller: true
  # Disable kube-proxy (using cilium kube-proxy replacement)
  disable-kube-proxy: true
  # Enabling Embedded Registry Mirror (Spegel)
  embedded-registry: true
  # TLS config
  tls-san:
    - "{{ k3s_api_vip }}"  # the API virtual IP (kube-vip)
  # Disable K3s addons: coredns, local path, servicelb, traefik and metric-server
  disable:
    - coredns
    - local-storage
    - servicelb
    - traefik
    - metrics-server
  # The admin kubeconfig: root only
  write-kubeconfig-mode: "0600"
  # Control plane nodes only run system pods, unless k3s_control_plane_taint is
  # false (host_vars). Applied when the node registers
  node-taint: "{{ ['node-role.kubernetes.io/control-plane:NoSchedule'] if k3s_control_plane_taint | default(true) | bool else [] }}"
  # Longhorn storage node (SSD boot, /storage on the SSD) if k3s_longhorn_storage
  # is true (host_vars). Applied when the node registers
  node-label: "{{ ['node_storage=longhorn'] if k3s_longhorn_storage | default(false) | bool else [] }}"
  # etcd-only server (k3s_etcd_only: true in host_vars): etcd member without API
  # server, controller manager and scheduler, ~0.45 GB instead of 1.3-1.9 GB.
  # etcd members next to node6, the only API server (docs/plans/cluster-2.0.md)
  disable-apiserver: "{{ k3s_etcd_only | default(false) | bool }}"
  disable-controller-manager: "{{ k3s_etcd_only | default(false) | bool }}"
  disable-scheduler: "{{ k3s_etcd_only | default(false) | bool }}"
  etcd-expose-metrics: true
  # etcd snapshots (every 12h, last 5) also uploaded to RustFS bucket k3s-etcd.
  # S3 endpoint and credentials: kube-system secret managed by External Secrets
  # (kubernetes/platform/k3s-etcd-backup)
  etcd-s3: true
  etcd-s3-config-secret: k3s-etcd-snapshot-s3-config
  kubelet-arg:
    - 'config=/etc/rancher/k3s/kubelet.config'
  # Leader leases 60s/40s/5s instead of 15s/10s/2s: k3s exits when one of these
  # loses its lease. With node6 starved of CPU (2026-11-07) etcd took 2-4 s per
  # request, the 10 s renewal deadline passed and k3s restarted 17 times.
  # Controller manager and scheduler run on the API server only (node6)
  kube-controller-manager-arg:
    - 'bind-address=0.0.0.0'
    - 'terminated-pod-gc-threshold=10'
    - 'leader-elect-lease-duration=60s'
    - 'leader-elect-renew-deadline=40s'
    - 'leader-elect-retry-period=5s'
  kube-scheduler-arg:
    - 'bind-address=0.0.0.0'
    - 'leader-elect-lease-duration=60s'
    - 'leader-elect-renew-deadline=40s'
    - 'leader-elect-retry-period=5s'
  # The cloud controller manager runs on every server, etcd-only ones too: the
  # holder's k3s exits when the API is gone longer than the renewal deadline, and
  # on node2/node3 its etcd member restarts with it (2026-11-07: 14 and 20 times,
  # once while node6 itself restarted). 180 s outlasts a k3s restart on node6
  # (95 s measured); a dead holder is replaced after up to 240 s
  kube-cloud-controller-manager-arg:
    - 'leader-elect-lease-duration=240s'
    - 'leader-elect-renew-deadline=180s'
    - 'leader-elect-retry-period=15s'

# k3s agent configuration
# Equivalent to starting the agent installer with:
#  --node-label 'node_type=worker'
#  --kubelet-arg 'config=/etc/rancher/k3s/kubelet.config'
k3s_agent_config:
  # Longhorn storage node only with k3s_longhorn_storage: true (host_vars): a worker
  # without SSD must not get Longhorn components or data
  node-label: "{{ ['node_type=worker'] + (['node_storage=longhorn'] if k3s_longhorn_storage | default(false) | bool else []) }}"
  kubelet-arg:
    - 'config=/etc/rancher/k3s/kubelet.config'

k3s_registries:
  mirrors:
    "*":
