---
- name: Run pre-configuration tasks
  ansible.builtin.include_tasks: pre_configuration.yml

- name: Get K3s installation script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s_install.sh
    mode: '0766'

- name: Install K3s
  ansible.builtin.command: "/tmp/k3s_install.sh agent"
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  changed_when: true

# The script skips the start when binary and unit are unchanged ("No change
# detected"): an agent rejoining after `systemctl disable --now k3s-agent` stays down
- name: Start K3s agent
  ansible.builtin.systemd:
    name: k3s-agent
    state: started
    enabled: true
