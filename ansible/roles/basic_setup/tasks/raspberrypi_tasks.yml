---

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ rpi_packages }}"
    update_cache: true
    state: present

- name: Copy utility scripts
  ansible.builtin.copy:
    src: "scripts/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: "root"
    group: "root"
    mode: "u=rwx,g=rx,o=rx"
  with_items:
    - pi_temp
    - pi_throttling

- name: Set GPU memory split to 16 MB
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    line: "gpu_mem=16"
    create: true
    mode: "0755"
  notify: Reboot

# usb-storage quirks (VID:PID:flags), e.g. "u" disables UAS for USB-SATA adapters
# that time out under write load. Replaces any existing usb-storage.quirks value
- name: Set usb-storage quirks in kernel command line
  when: rpi_usb_storage_quirks | length > 0
  block:
    - name: Read kernel command line
      ansible.builtin.slurp:
        src: /boot/firmware/cmdline.txt
      register: rpi_cmdline

    # cmdline.txt is a single line of words: drop any usb-storage.quirks word and
    # append the wanted one. copy only reports a change when the content differs
    - name: Write kernel command line with usb-storage quirks
      ansible.builtin.copy:
        dest: /boot/firmware/cmdline.txt
        content: >-
          {{ ((rpi_cmdline.content | b64decode).split()
          | reject('match', 'usb-storage[.]quirks=') | list
          + ['usb-storage.quirks=' ~ (rpi_usb_storage_quirks | join(','))]) | join(' ') }}
        mode: "0755"
      notify: Reboot
