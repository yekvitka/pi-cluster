apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: production-ingress-template
  namespace: default
  annotations:
    # Use NGINX Ingress Controller
    kubernetes.io/ingress.class: "nginx"
    
    # TLS and security related annotations
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # External-DNS annotations for automatic DNS records
    external-dns.alpha.kubernetes.io/hostname: "your-service.homelab.yekvitka.com"
    external-dns.alpha.kubernetes.io/target: "10.0.0.12"  # Use a stable node IP
    
    # Performance and optimization annotations
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    
spec:
  # TLS configuration
  tls:
  - hosts:
    - your-service.homelab.yekvitka.com
    secretName: your-service-tls
  
  # Host and path rules
  rules:
  - host: your-service.homelab.yekvitka.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: your-service
            port:
              number: 80
