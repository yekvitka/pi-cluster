apiVersion: apps/v1
kind: Deployment
metadata:
  name: flux
  namespace: flux-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flux
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        prometheus.io/port: "3031"
        prometheus.io/scrape: "true"
      labels:
        app: flux
    spec:
      serviceAccountName: flux
      volumes:
      - name: git-key
        secret:
          defaultMode: 256
          secretName: flux-git-deploy
      - name: git-keygen
        emptyDir:
          medium: Memory
      containers:
      - name: flux
        image: fluxcd/flux-cli:v2.0.0-rc.5
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "FluxCD v2 placeholder - original v1 image had architecture issues"
          echo "Use fluxcd/flux-cli v2 for ARM compatibility"
          sleep infinity
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - name: git-key
          mountPath: /etc/fluxd/ssh
          readOnly: true
        - name: git-keygen
          mountPath: /var/fluxd/keygen
