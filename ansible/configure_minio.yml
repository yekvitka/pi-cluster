---
# RustFS buckets, users and policies with terraform/minio (MinIO-compatible
# provider). Reads the admin secret secret/s3/rustfsadmin from Vault through
# ~/.secrets/vault.env.
#
# Usage: make configure-minio

- name: Configure RustFS buckets, users and policies with Terraform
  hosts: localhost
  gather_facts: false
  tags: [minio, terraform]
  vars:
    terraform_project_dir: "../terraform/minio"

  pre_tasks:
    - name: Load Vault session (vault_addr, vault_token, vault_cacert)
      ansible.builtin.include_tasks: tasks/vault_session.yml

    - name: Fetch MinIO credentials from Vault
      community.hashi_vault.vault_kv2_get:
        url: "{{ vault_addr }}"
        token: "{{ vault_token }}"
        ca_cert: "{{ vault_cacert | default(omit) }}"
        mount_point: "secret"
        path: "s3/rustfsadmin"
      register: minio_vault_secret
      no_log: true

    - name: Set MinIO credentials from Vault
      ansible.builtin.set_fact:
        minio_root_user: >-
          {{ (minio_vault_secret.secret | default({})).username | default('', true) }}
        minio_root_password: >-
          {{ (minio_vault_secret.secret | default({})).key | default('', true) }}
      no_log: true

    - name: Validate MinIO credentials were retrieved from Vault
      ansible.builtin.assert:
        that:
          - minio_root_user is defined
          - minio_root_user | length > 0
          - minio_root_password is defined
          - minio_root_password | length > 0
        fail_msg: |
          ⚠️  Failed to retrieve MinIO credentials from Vault!

          The following credentials are missing or empty:
          {% if minio_root_user is not defined or minio_root_user | length == 0 %}
            - minio_root_user (root_user)
          {% endif %}
          {% if minio_root_password is not defined or minio_root_password | length == 0 %}
            - minio_root_password (root_password)
          {% endif %}

          Please verify:
          1. Vault is accessible at: {{ vault_addr }}
          2. Secret exists at path: secret/s3/rustfsadmin
          3. Secret contains keys: username, key

          To check the secret:
            vault kv get secret/s3/rustfsadmin
        success_msg: "✓ MinIO credentials successfully retrieved from Vault for Terraform"

  tasks:
    # One environment for every tofu command: the providers (Vault, RustFS)
    # and the S3 backend, which stores the state on RustFS
    - name: Set the OpenTofu environment
      ansible.builtin.set_fact:
        tofu_env:
          VAULT_ADDR: "{{ vault_addr }}"
          VAULT_TOKEN: "{{ vault_token }}"
          VAULT_CACERT: "{{ vault_cacert if (not enable_letsencrypt | default(false)) else '' }}"
          TF_VAR_minio_endpoint: "{{ rustfs_endpoint }}"
          TF_VAR_minio_use_ssl: "true"
          TF_VAR_minio_admin_user: "{{ minio_root_user }}"
          TF_VAR_minio_admin_password: "{{ minio_root_password }}"
          TF_VAR_vault_address: "{{ vault_addr }}"
          TF_VAR_vault_token: "{{ vault_token }}"
          AWS_ENDPOINT_URL_S3: "{{ rustfs_url }}"
          AWS_ACCESS_KEY_ID: "{{ minio_root_user }}"
          AWS_SECRET_ACCESS_KEY: "{{ minio_root_password }}"
      no_log: true

    # tofu_migrate_state=true: one time, copies a local terraform.tfstate into
    # the bucket (docs/runbooks/github-actions-runner.md). Without it, a local
    # state file stops the run here, before tofu offers to overwrite anything.
    - name: Check for a local state file
      ansible.builtin.stat:
        path: "{{ terraform_project_dir }}/terraform.tfstate"
      register: local_tfstate

    - name: Stop while a local state file is still in terraform/minio
      ansible.builtin.fail:
        msg: |
          terraform/minio/terraform.tfstate exists, but the state lives in the
          RustFS bucket {{ tofu_state_bucket }}.
          - Not moved yet: follow docs/runbooks/github-actions-runner.md,
            "Move the minio state to RustFS" (run with -e tofu_migrate_state=true).
          - Already moved: the local file is stale, move it to ~/tfstate-backup/.
      when:
        - local_tfstate.stat.exists
        - not (tofu_migrate_state | default(false) | bool)

    - name: Initialize Terraform
      ansible.builtin.command:
        cmd: >-
          tofu init -no-color -input=false -backend-config=bucket={{ tofu_state_bucket }}
          {{ '-migrate-state -force-copy' if (tofu_migrate_state | default(false) | bool) else '' }}
        chdir: "{{ terraform_project_dir }}"
      environment: "{{ tofu_env }}"
      register: terraform_init
      changed_when: "'successfully initialized' in terraform_init.stdout"

    # plan_only=true: stop after the plan (Deploy workflow, before approval).
    # apply_only=true: apply the saved tfplan as it is (after approval); OpenTofu
    # refuses it if the state changed since the plan.
    - name: Plan Terraform changes
      ansible.builtin.command:
        cmd: tofu plan -no-color -input=false -out=tfplan
        chdir: "{{ terraform_project_dir }}"
      environment: "{{ tofu_env }}"
      changed_when: false
      register: terraform_plan
      when: not (apply_only | default(false) | bool)

    # The changed resources and the totals; provider warnings (the deprecated
    # Vault data source) used to push them out of a last-lines view
    - name: Display Terraform plan summary
      ansible.builtin.debug:
        msg: "{{ terraform_plan.stdout_lines | select('match', '^(\\s+# |Plan: |No changes\\.|Changes to Outputs)') | list }}"
      when: not (apply_only | default(false) | bool)

    - name: Apply Terraform configuration
      ansible.builtin.command:
        cmd: tofu apply -no-color -input=false -auto-approve tfplan
        chdir: "{{ terraform_project_dir }}"
      environment: "{{ tofu_env }}"
      register: terraform_apply
      changed_when: "'Apply complete!' in terraform_apply.stdout"
      when: not (plan_only | default(false) | bool)

    - name: Display Terraform apply result
      ansible.builtin.debug:
        msg: "{{ terraform_apply.stdout_lines | select('match', '^Apply complete!') | list }}"
      when: not (plan_only | default(false) | bool)

    - name: Display Terraform outputs
      ansible.builtin.command:
        cmd: tofu output -no-color -json
        chdir: "{{ terraform_project_dir }}"
      environment: "{{ tofu_env }}"
      register: terraform_outputs
      changed_when: false
      when: not (plan_only | default(false) | bool)

    - name: Display MinIO configuration information
      when: not (plan_only | default(false) | bool)
      ansible.builtin.debug:
        msg: |
         ╔════════════════════════════════════════════════════════════╗
         ║       MinIO Configuration Completed Successfully!          ║
         ╚════════════════════════════════════════════════════════════╝

         Buckets Created: {{ (terraform_outputs.stdout | from_json).buckets.value | default({}) | length }}
         Users Created: {{ (terraform_outputs.stdout | from_json).users.value | default({}) | length }}
         Policies Created: {{ (terraform_outputs.stdout | from_json).policies.value | default({}) | length }}

         Access Information:

         API Server:
           URL: https://{{ rustfs_hostname }}:{{ rustfs_server_port }}
           Access via: rc alias set rustfs https://{{ rustfs_hostname }}:{{ rustfs_server_port }} $USERNAME $PASSWORD

         Console (Web UI):
           URL: https://{{ rustfs_hostname }}:{{ rustfs_console_port }}/rustfs/console/
           Open in browser and login with credentials from Vault

         Credentials:
           Stored securely in Vault at: secret/s3/rustfsadmin
           Retrieved on-demand during configuration
