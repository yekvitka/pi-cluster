[defaults]
# Inventory file location
inventory       = ./inventory.yml
# Ansible execution threads
forks          = 10
# Paths to search for roles in, colon separated
roles_path    = ~/.ansible/roles:./roles
# Path for collections
collections_path = ~/.ansible/collections
# Check SSH host keys: a new host is trusted on first use (accept-new below),
# a changed key stops the run. After reprovisioning a node: ssh-keygen -R <ip>
host_key_checking = true

# Render task results in readable YAML format (avoids escaped \n in debug output)
callback_result_format = yaml
callback_format_pretty = true

# Silencing Python Interpreter Warnings in Ansible
# https://docs.ansible.com/ansible-core/2.17/reference_appendices/interpreter_discovery.html
interpreter_python = auto_silent

[ssh_connection]
# One SSH round trip per task instead of several, with become too (Ubuntu's
# sudoers has no requiretty): the nodes are ~40 ms away from the Oracle VM
pipelining = True
# Ansible's default arguments, plus trust on first use
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
