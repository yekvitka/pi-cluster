---
# Playbook to clean up non-essential services from the K3s cluster
- name: Clean up K3s Cluster
  hosts: node2
  gather_facts: false
  tasks:
    - name: Get list of namespaces to clean
      shell: >
        kubectl get namespace -o name | grep -E 'longhorn-system|observability|flux-system' | sed 's|namespace/||g'
      register: namespaces_to_clean
      ignore_errors: yes

    - name: Display namespaces to clean
      debug:
        msg: "Will clean up namespace: {{ item }}"
      loop: "{{ namespaces_to_clean.stdout_lines }}"
      when: namespaces_to_clean.stdout_lines | length > 0

---
# Simplified playbook to clean up non-essential services from the K3s cluster
# Instead of deleting namespaces, we delete individual resources
- name: Clean up K3s Cluster - Workload Cleanup
  hosts: node2
  gather_facts: false
  tasks:
    - name: Remove Longhorn resources
      block:
        - name: Check if longhorn-system namespace exists
          shell: kubectl get namespace longhorn-system
          register: longhorn_ns
          failed_when: false
          changed_when: false

        - name: Clean up Longhorn resources
          shell: |
            kubectl -n longhorn-system delete deployment --all
            kubectl -n longhorn-system delete daemonset --all
            kubectl -n longhorn-system delete statefulset --all
          when: longhorn_ns.rc == 0
          ignore_errors: yes

    - name: Remove Observability resources
      block:
        - name: Check if observability namespace exists
          shell: kubectl get namespace observability
          register: observability_ns
          failed_when: false
          changed_when: false

        - name: Clean up Observability resources
          shell: |
            kubectl -n observability delete deployment --all
            kubectl -n observability delete daemonset --all
            kubectl -n observability delete statefulset --all
          when: observability_ns.rc == 0
          ignore_errors: yes

    - name: Remove FluxCD resources
      block:
        - name: Check if flux-system namespace exists
          shell: kubectl get namespace flux-system
          register: flux_ns
          failed_when: false
          changed_when: false

        - name: Clean up FluxCD resources
          shell: |
            kubectl -n flux-system delete deployment --all
            kubectl -n flux-system delete daemonset --all
          when: flux_ns.rc == 0
          ignore_errors: yes

    - name: Clean up failed/evicted pods
      shell: |
        for pod in $(kubectl get pods --all-namespaces | grep -E "Evicted|Failed" | awk '{print $1" "$2}'); do
          ns=$(echo $pod | awk '{print $1}')
          name=$(echo $pod | awk '{print $2}')
          kubectl delete pod -n $ns $name --force --grace-period=0
        done
      ignore_errors: yes

    - name: Clean up unused PVs
      shell: |
        for pv in $(kubectl get pv | grep Released | awk '{print $1}'); do
          kubectl delete pv $pv --force --grace-period=0
        done
      ignore_errors: yes

    - name: Wait for cleanup to complete
      pause:
        seconds: 10

- name: Clean up system resources
  hosts: k3s_cluster
  gather_facts: false
  tasks:
    - name: Perform system cleanup
      shell: |
        sync
        echo 3 > /proc/sys/vm/drop_caches
      become: true
      ignore_errors: yes

    - name: Clean Docker images if Docker is installed
      shell: which docker && docker system prune -af || echo "Docker not installed"
      ignore_errors: yes

    - name: Restart containerd
      systemd:
        name: containerd
        state: restarted
      become: true
      ignore_errors: yes

- name: Wait for system to stabilize
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Pause for stability
      pause:
        seconds: 20

    - name: Clean up persistent volumes
      shell: >
        kubectl get pv | grep Released | awk '{print $1}' | xargs -I{} kubectl delete pv {}
      ignore_errors: yes

    - name: Clean up failed/evicted pods
      shell: >
        kubectl get pods --all-namespaces | grep -E "Evicted|Failed" | awk '{print "-n " $1 " " $2}' | xargs -r kubectl delete pod
      ignore_errors: yes
      
    - name: Clean up Longhorn deployments
      shell: >
        kubectl delete deployment --all -n longhorn-system --force --grace-period=0 --timeout=30s || true
      ignore_errors: yes
      async: 60
      poll: 0
      
    - name: Clean up Observability deployments
      shell: >
        kubectl delete deployment --all -n observability --force --grace-period=0 --timeout=30s || true
      ignore_errors: yes
      async: 60
      poll: 0
      
    - name: Clean up FluxCD deployments
      shell: >
        kubectl delete deployment --all -n flux-system --force --grace-period=0 --timeout=30s || true
      ignore_errors: yes
      async: 60
      poll: 0

- name: Restart K3s on nodes
  hosts: k3s_cluster
  gather_facts: false
  tasks:
    - name: Stop K3s service
      systemd:
        name: "{{ 'k3s' if ansible_hostname in groups['k3s_master'] else 'k3s-agent' }}"
        state: stopped
      become: true
      ignore_errors: yes

    - name: Start K3s service
      systemd:
        name: "{{ 'k3s' if ansible_hostname in groups['k3s_master'] else 'k3s-agent' }}"
        state: started
      become: true
      ignore_errors: yes
