apiVersion: v1
data:
  Corefile: |
    .:53 {
        errors
        health
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
          pods insecure
          fallthrough in-addr.arpa ip6.arpa
        }
        hosts /etc/coredns/NodeHosts {
          ttl 60
          reload 15s
          fallthrough
        }
        prometheus :9153
        forward . /etc/resolv.conf
        cache 30
        loop
        reload
        loadbalance
        import /etc/coredns/custom/*.override
    }
    import /etc/coredns/custom/*.server
  NodeHosts: |
    10.0.0.12 node2
    10.0.0.13 node3
    10.0.0.14 node4
    10.0.0.15 node5
    2a02:a310:c197:1700:da3a:ddff:fe3b:46ed node2
    2a02:a310:c197:1700:da3a:ddff:fe3b:472f node5
    2a02:a310:c197:1700:da3a:ddff:fed4:8efc node4
