---
# THROWAWAY, never merge. Proves that scripts/runner-job-guard.sh (the runner's
# job-started hook on pimaster) blocks pull request jobs, the way a fork PR
# that edits a workflow would try to use the runner.
#
# Expected: the job FAILS in "Set up job" and the step below never runs.
# A green job means the guard did not block it.
name: Guard smoke test
'on':
  pull_request:

permissions:
  contents: read

jobs:
  must-be-blocked:
    name: Must be blocked by the runner guard
    runs-on: [self-hosted, pimaster]
    timeout-minutes: 5
    steps:
      - name: Must never run
        run: |
          echo "GUARD DID NOT BLOCK: this step ran on $(hostname)"
          date -u > /tmp/guard-smoke-test-ran
