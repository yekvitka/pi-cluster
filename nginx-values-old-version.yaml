controller:
  image:
    # Using an older version that might be more stable on ARM
    repository: k8s.gcr.io/ingress-nginx/controller
    tag: "v1.0.4"
    digest: ""
  
  # Enabling Promethues metrics only for now
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

  # Allow snippet anotations
  allowSnippetAnnotations: true

  # Set specific LoadBalancer IP address for Ingress service
  service:
    annotations:
      io.cilium/lb-ipam-ips: 10.0.0.110
